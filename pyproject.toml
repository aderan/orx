[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orx-agent"
version = "0.1.0"
description = "ORX: an orchestrator for host and CLI coding agents with one authoritative plan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.scripts]
orx = "orx.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orx"]

[tool.hatch.build.targets.wheel.force-include]
# Skills ship inside the distribution at orx/skills/ (source of truth stays
# at repo-root skills/); editable checkouts fall back to the repo copy.
"skills" = "orx/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
