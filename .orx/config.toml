schema_version = 1

# Daily CLI routing validated in Stage 4. The current ADE conversation is
# the Controller. This compatibility profile does not launch that session.
[controller]
profile = "orx-host"

[plan]
depth = "standard"

# The Controller chooses --depth. Each list is an ordered candidate pool.
[plan.light]
profiles = ["claude-plan", "codex-verify"]

[plan.standard]
profiles = ["claude-plan", "codex-verify"]

[plan.deep]
profiles = ["claude-plan-deep", "codex-verify"]

# Native candidates are filtered against the current host and agent list.
[worker]
profiles = ["zcode-cli-worker", "cursor-cli-worker", "zcode-worker", "orx-host"]

# Project commands provide deterministic checks. Agent checks use this pool.
[verify]
profiles = ["codex-verify", "zcode-verifier-flash", "cursor-economy", "orx-host"]

[runtime]
max_parallel = 1
command_timeout_sec = 1800
