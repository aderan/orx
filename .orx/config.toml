schema_version = 1

# Routing strategy — the executed form of docs/routing-strategy.md.
# 2026-10-04: aligned with the zcode preset (orx preset install zcode +
# `orx config set --user`): ZCode subagents are the primary worker/verifier,
# Cursor is the fallback; planning stays on the frontier CLI pool.
# Tiers: frontier (codex/claude flagships) / strong (glm, grok) /
# economy (flash/compose). Effort: low|medium|high|xhigh|max.

# Controller: the ZCode host session itself (GLM-5.3 strong + high).
[controller]
profile = "zcode-controller"

[plan]
depth = "auto"
allow_class_downgrade = false

# All depths run the frontier pool at high effort (deep keeps the
# frontier-only gate).
[plan.light]
profiles = ["codex-frontier", "cursor-frontier"]

[plan.standard]
profiles = ["codex-frontier", "cursor-frontier"]

[plan.deep]
profiles = ["codex-frontier", "cursor-frontier"]

# Worker ladder: ZCode GLM-5.3 subagent first, Cursor grok-4.7 fallback.
# A Cursor-first project flips the two entries.
[worker]
profiles = ["zcode-worker", "cursor-strong"]

# V0 deterministic checks run as shell commands (no LLM). Agent checks:
# ZCode Flash subagent first (economy), Cursor composer-2.5 fallback.
[verify]
profiles = ["zcode-verifier-flash", "cursor-economy"]

[runtime]
max_parallel = 1
command_timeout_sec = 1800
