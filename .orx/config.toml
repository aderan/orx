schema_version = 1

# Routing strategy (2026-10-03) — the executed form of docs/routing-strategy.md.
# Tiers: frontier (codex/claude flagships) / strong (glm, grok, deepseek) /
# economy (flash/compose). Effort: low|medium|high|xhigh|max.

# Controller: strong + max (GLM host compensates class with max depth).
[controller]
profile = "orx-host"

[plan]
depth = "auto"
allow_class_downgrade = false

# light = trivial single-task plans stay on strong+medium; standard/deep run
# the frontier pool at high effort (deep keeps the frontier-only gate).
[plan.light]
profiles = ["cursor-strong"]

[plan.standard]
profiles = ["codex-frontier", "cursor-frontier"]

[plan.deep]
profiles = ["codex-frontier", "cursor-frontier"]

# Escalation ladder in list order: strong+medium -> strong+high -> host(strong)
# -> frontier+high. user directive 2026-10-03: cursor-agent does the build
# execution; codex-frontier stays primary for planning and is the build
# fallback of last resort.
[worker]
profiles = ["cursor-strong", "cursor-strong-high", "orx-host", "cursor-frontier", "codex-frontier"]

# V0 deterministic checks run as shell commands (no LLM). Agent checks:
# economy+medium first (structural), strong fallback (semantic).
[verify]
profiles = ["orx-host", "cursor-economy", "cursor-strong"]

[runtime]
max_parallel = 1
command_timeout_sec = 1800
