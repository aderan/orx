schema_version = 1

# ZCode preset routing. The Controller chooses planning depth, and each
# depth uses the configured ZCode host profile.

[controller]
profile = "zcode-controller"

[plan]
depth = "standard"

[plan.light]
profiles = ["zcode-controller"]

[plan.standard]
profiles = ["zcode-controller"]

[plan.deep]
profiles = ["zcode-controller"]

[worker]
profiles = ["zcode-worker"]

[verify]
profiles = ["zcode-verifier-flash", "zcode-verifier-strong"]

[runtime]
max_parallel = 1
command_timeout_sec = 1800
